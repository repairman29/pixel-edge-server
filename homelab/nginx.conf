# homelab/nginx.conf — Reverse proxy for Pixel homelab services
#
# Routes:
#   /           → Jellyfin media server (8096)
#   /ollama/    → Ollama LLM API (11434)
#   /ai/        → Claude Gateway (3456)
#
# Tailscale URL: http://100.78.73.64/

events {
  worker_connections 256;
}

http {
  # ── Jellyfin ───────────────────────────────────────────────────────────────
  upstream jellyfin {
    server jellyfin:8096;
    keepalive 8;
  }

  # ── Ollama ─────────────────────────────────────────────────────────────────
  upstream ollama {
    server ollama:11434;
  }

  # ── Claude Gateway (on host VM, not in Docker) ─────────────────────────────
  upstream claude_gateway {
    server host.docker.internal:3456;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Jellyfin — root
    location / {
      proxy_pass         http://jellyfin;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      # WebSocket support for Jellyfin
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_read_timeout 600s;
    }

    # Ollama LLM API
    location /ollama/ {
      rewrite ^/ollama/(.*) /$1 break;
      proxy_pass         http://ollama;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_read_timeout 300s;
      # SSE support for streaming responses
      proxy_buffering    off;
      proxy_cache        off;
    }

    # Claude Gateway
    location /ai/ {
      rewrite ^/ai/(.*) /$1 break;
      proxy_pass         http://claude_gateway;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_read_timeout 300s;
      # SSE + streaming
      proxy_buffering    off;
      proxy_cache        off;
    }
  }
}
