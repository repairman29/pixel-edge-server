[package]
name = "pixel-agent-v2"
version = "0.1.0"
edition = "2021"
description = "Best-in-class Pixel agent: gateway, router, reflexive/neocortex, heartbeat, memory, outbox"

[dependencies]
# Gateway / HTTP (Phase 2)
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls avoids OpenSSL (builds reliably in Termux)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Config
config = "0.14"

[profile.release]
# Lighter profile for device (avoid OOM); override on Mac with CARGO_PROFILE_RELEASE_LTO=true
lto = false
codegen-units = 4
opt-level = 3
